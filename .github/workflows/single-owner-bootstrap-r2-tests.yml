name: PatroAI single-owner R2 — full-repository security CI

on:
  pull_request:
    paths:
      - "tools/bootstrap_single_owner.py"
      - "tests/test_single_owner_bootstrap.py"
      - "pytest.ini"
      - ".github/workflows/single-owner-bootstrap-r2-tests.yml"
      - "dashboard/**"
      - "test_super_admin_r2.py"
      - "requirements*.txt"
      - "alembic/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2-unit:
    name: R2 compatibility and security unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install test dependencies from complete backend
        run: python -m pip install -r requirements-test.txt pytest
      - name: Require real R2 modules and audited hashes
        shell: bash
        run: |
          set -euo pipefail
          test -f dashboard/auth.py
          test -f dashboard/models.py
          test -f test_super_admin_r2.py
          printf '%s\n' \
            'b96d870a621e4571fd9c5b8654b846c6ac95616d3dfbe62d9ee838a63fade261  tools/bootstrap_single_owner.py' \
            '5e8e18e92077752ba5e37436f1c6b67be1b63ddf66a30b88ae8875538c05bb27  dashboard/auth.py' \
            'c50ad376d4bec44f201ef881e137991d0627cfc747c6aba97bc2a8b6d4e172a1  dashboard/models.py' | sha256sum -c -
          python -c 'import dashboard.auth, dashboard.models; print("R2_IMPORTS=PASS")'
      - name: Focused tests (PostgreSQL integration is in a distinct job)
        run: python -m pytest -q -ra -m "not integration_postgres" tests/test_single_owner_bootstrap.py test_super_admin_r2.py

  postgres-18-lab:
    name: Ephemeral PostgreSQL 18 R1-to-R2 and bootstrap tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: patroai_ci
          POSTGRES_PASSWORD: patroai_ci_ephemeral_only
          POSTGRES_DB: patroai_r2_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patroai_ci -d patroai_r2_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI_LAB_DATABASE_URL: postgresql+psycopg://patroai_ci:patroai_ci_ephemeral_only@127.0.0.1:5432/patroai_r2_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt pytest
      - name: Verify exact audited bootstrap
        run: echo "b96d870a621e4571fd9c5b8654b846c6ac95616d3dfbe62d9ee838a63fade261  tools/bootstrap_single_owner.py" | sha256sum -c -
      - name: Apply R1 then R2 ONLY to ephemeral CI lab
        env:
          DATABASE_URL: ${{ env.CI_LAB_DATABASE_URL }}
          PATROAI_ALLOW_MIGRATION_EXECUTION: "true"
        run: |
          python -m alembic upgrade 0001_patroai
          python -m alembic upgrade 0002_patroai_super_admin_r2
      - name: Verify lab before integration
        env:
          DATABASE_URL: ${{ env.CI_LAB_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          assert url.drivername == "postgresql+psycopg"
          assert url.database == "patroai_r2_lab"
          with create_engine(url).connect() as c:
              assert c.execute(text("SELECT current_database()")).scalar_one() == "patroai_r2_lab"
              assert int(c.execute(text("SHOW server_version_num")).scalar_one()) // 10000 == 18
              assert c.execute(text("SELECT version_num FROM public.alembic_version")).scalar_one() == "0002_patroai_super_admin_r2"
              for table in ("patroai_admin_staff", "patroai_admin_audit"):
                  assert c.execute(text(f"SELECT count(*) FROM public.{table}")).scalar_one() == 0
          print("CI_PG_PREFLIGHT=PASS")
          PY
      - name: Execute PostgreSQL integration tests (no skip accepted)
        env:
          PATROAI_BOOTSTRAP_TEST_DATABASE_URL: ${{ env.CI_LAB_DATABASE_URL }}
        run: |
          python -m pytest -q -ra -m integration_postgres tests/test_single_owner_bootstrap.py --junitxml=pg-integration.xml
          python - <<'PY'
          from xml.etree import ElementTree as ET
          root = ET.parse("pg-integration.xml").getroot()
          cases = list(root.iter("testcase"))
          assert len(cases) == 2, f"Expected two PostgreSQL tests, got {len(cases)}"
          for case in cases:
              assert not any(case.find(n) is not None for n in ("skipped", "failure", "error")), case.attrib
          print("CI_PG_TWO_TESTS=PASS_NO_SKIPS")
          PY
      - name: Verify lab clean after transactions
        env:
          DATABASE_URL: ${{ env.CI_LAB_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DATABASE_URL"])
          assert url.database == "patroai_r2_lab"
          with create_engine(url).connect() as c:
              for table in ("patroai_admin_staff", "patroai_admin_audit"):
                  assert c.execute(text(f"SELECT count(*) FROM public.{table}")).scalar_one() == 0
          print("CI_PG_FINAL_ACCOUNTS=0")
          print("CI_PG_FINAL_AUDITS=0")
          PY
